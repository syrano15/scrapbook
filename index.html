<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" id="themeColor">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-v2-192.png">
<link rel="apple-touch-icon" href="icon-v2-512-maskable.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>스크랩북</title>
<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f5f6f8;
  --text: #1a1c1f;
  --text-2: #3d4249;
  --muted: #6b717a;
  --line: #e4e6ea;
  --line-strong: #cfd3d9;
  --accent: #1f4a86;
  --accent-soft: #eef3fa;
  --danger: #b42318;
  --ok: #1f7a4d;
  --fs: 18px;
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
html[data-theme="dark"] {
  --bg: #131518;
  --bg-soft: #1b1e22;
  --text: #e7e9ec;
  --text-2: #c9cdd3;
  --muted: #9198a2;
  --line: #2a2e34;
  --line-strong: #3a3f46;
  --accent: #8fb3ea;
  --accent-soft: #1c2533;
  --danger: #f08c80;
  --ok: #7fd1a6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  word-break: keep-all; overflow-wrap: break-word;
}
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
.muted { color: var(--muted); }
.balance { text-wrap: balance; }
.pretty { text-wrap: pretty; }

/* ---------- 상단 바 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
  transition: transform 260ms var(--ease);
  padding-top: env(safe-area-inset-top);
}
.topbar.hide { transform: translateY(-100%); }
.topbar-in { display: flex; align-items: center; gap: 6px; height: 52px; }
.brand { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin-right: auto; color: var(--text); text-decoration: none; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 40px; padding: 0 8px;
  border-radius: 8px; color: var(--text-2); font-size: 14px; font-weight: 600; gap: 4px;
  transition: background-color 150ms ease, transform 160ms var(--ease);
}
.icon-btn:active { transform: scale(0.96); }
.icon-btn svg { width: 20px; height: 20px; }
@media (hover: hover) and (pointer: fine) { .icon-btn:hover { background: var(--bg-soft); } }
.back { margin-left: -8px; margin-right: auto; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; padding: 0 4px; }
.sync.err { color: var(--danger); font-weight: 700; cursor: pointer; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; background: var(--accent); width: 0; transition: width 120ms linear; }

/* ---------- 목록 ---------- */
.list-head { padding: 22px 0 8px; }
.search {
  width: 100%; height: 44px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 14px;
  background: var(--bg); font-size: 16px; outline: none; transition: border-color 150ms ease;
}
.search:focus { border-color: var(--accent); }
.filters { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; align-items: center; }
.filters::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-strong);
  font-size: 14px; color: var(--text-2); background: var(--bg);
  transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease, transform 160ms var(--ease);
}
.chip:active { transform: scale(0.96); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip .n { margin-left: 4px; opacity: .6; font-variant-numeric: tabular-nums; }
.sort { margin-left: auto; flex: none; height: 34px; border: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 0 4px; }

.items { list-style: none; margin: 8px 0 0; padding: 0; }
.item { border-bottom: 1px solid var(--line); }
.item a {
  display: flex; gap: 16px; padding: 18px 0; color: inherit; text-decoration: none; align-items: flex-start;
  transition: opacity 150ms ease;
}
.item a:active { opacity: .6; }
.item .txt { flex: 1; min-width: 0; }
.item .kick { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.item h2 { font-size: 18px; line-height: 1.45; margin: 4px 0 6px; font-weight: 700; letter-spacing: -0.01em; text-wrap: pretty; }
.item p { margin: 0; font-size: 14.5px; color: var(--text-2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: pretty; }
.item .tags { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.nw { white-space: nowrap; }
.thumb { flex: none; width: 104px; height: 78px; border-radius: 6px; background: var(--bg-soft); overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 240ms ease; }
.thumb img.on { opacity: 1; }
@media (max-width: 480px) { .thumb { width: 84px; height: 64px; } .item h2 { font-size: 17px; } }
.badge { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 4px; background: var(--bg-soft); color: var(--text-2); }
.badge.reading { background: var(--accent-soft); color: var(--accent); }
.badge.done { color: var(--muted); }
.item.is-done h2 { color: var(--muted); font-weight: 600; }
.item.is-done p { color: var(--muted); }
.item.is-done .thumb { opacity: .45; filter: grayscale(1); }
.star { color: #c58a00; }
html[data-theme="dark"] .star { color: #e8b64a; }
.empty { padding: 56px 0; text-align: center; color: var(--muted); font-size: 15px; }
.list-foot { padding: 28px 0 48px; display: flex; gap: 16px; justify-content: center; font-size: 13px; }
.list-foot a { color: var(--muted); }

/* ---------- 기사 ---------- */
.art-head { padding: 28px 0 0; }
.art-kick { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.art-title { font-size: 30px; line-height: 1.38; font-weight: 800; letter-spacing: -0.025em; margin: 12px 0 10px; text-wrap: balance; }
.art-sub { font-size: 18px; line-height: 1.55; color: var(--text-2); margin: 0 0 14px; text-wrap: pretty; }
.art-by { font-size: 14.5px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 12px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.art-by b { color: var(--text); }
.art-orig { font-size: 13.5px; color: var(--muted); margin: 10px 0 0; font-style: italic; }
@media (max-width: 520px) { .art-title { font-size: 25px; } .art-sub { font-size: 16.5px; } }

.tabs {
  position: sticky; z-index: 10; background: var(--bg); display: flex; gap: 22px; border-bottom: 1px solid var(--line);
  margin-top: 4px; top: calc(53px + env(safe-area-inset-top)); transition: top 260ms var(--ease);
}
.tabs.up { top: env(safe-area-inset-top); }
.tab {
  position: relative; height: 48px; font-size: 15.5px; font-weight: 700; color: var(--muted);
  transition: color 150ms ease;
}
.tab[aria-selected="true"] { color: var(--text); }
.tab::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--text); transform: scaleX(0); transition: transform 220ms var(--ease); }
.tab[aria-selected="true"]::after { transform: scaleX(1); }
.tab-tools { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; height: 30px; }
.seg button { padding: 0 10px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

.notice { margin: 22px 0 0; padding: 12px 14px; border-left: 3px solid var(--line-strong); font-size: 14px; line-height: 1.7; color: var(--text-2); background: var(--bg-soft); border-radius: 0 6px 6px 0; text-wrap: pretty; }
.notice.warn { border-left-color: #c58a00; }
.notice a { font-weight: 700; }

.prose { font-size: var(--fs); line-height: 1.9; padding: 26px 0 8px; }
.prose p { margin: 0 0 1.35em; text-wrap: pretty; }
.prose h2 { font-size: 1.12em; line-height: 1.5; margin: 2.2em 0 .8em; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
.prose h2:first-child { margin-top: .2em; }
.prose h3 { font-size: 1.02em; margin: 1.8em 0 .5em; font-weight: 800; text-wrap: balance; }
.prose h4 { font-size: .95em; margin: 1.4em 0 .4em; font-weight: 800; }
.prose blockquote { margin: 1.6em 0; padding: 2px 0 2px 18px; border-left: 3px solid var(--text); color: var(--text-2); }
.prose blockquote p:last-child { margin-bottom: 0; }
.prose blockquote cite { display: block; font-style: normal; font-size: .82em; color: var(--muted); margin-top: .4em; }
.prose ul, .prose ol { margin: 0 0 1.35em; padding-left: 1.3em; }
.prose li { margin: .3em 0; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 2.4em 0; }
.prose code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .86em; background: var(--bg-soft); padding: 1px 5px; border-radius: 4px; }
.prose .ed-note { font-size: .82em; color: var(--muted); line-height: 1.7; }
.prose figure { margin: 2em 0; }
.prose figure.wide { margin-left: -20px; margin-right: -20px; }
@media (min-width: 760px) { .prose figure.wide { margin-left: 0; margin-right: 0; } }
.prose figure .ph { display: block; width: 100%; background: var(--bg-soft); cursor: zoom-in; border-radius: 4px; overflow: hidden; }
.prose figure img { display: block; width: 100%; height: auto; }
.prose figcaption { font-size: 13.5px; line-height: 1.6; color: var(--muted); margin-top: 8px; padding: 0 20px; text-wrap: pretty; }
@media (min-width: 760px) { .prose figcaption { padding: 0; } }
.prose figcaption .credit { opacity: .8; }
.img-fail { display: flex; align-items: center; justify-content: center; min-height: 120px; font-size: 13px; color: var(--muted); }
.prose table { width: 100%; border-collapse: collapse; font-size: .86em; line-height: 1.65; margin: 0 0 1.6em; }
.prose th, .prose td { text-align: left; vertical-align: top; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); }
.prose th { font-size: .92em; color: var(--muted); font-weight: 700; border-bottom-color: var(--line-strong); }
.prose td:first-child { font-weight: 700; white-space: nowrap; }
@media (max-width: 520px) { .prose td:first-child { white-space: normal; min-width: 5.5em; } }
.table-scroll { overflow-x: auto; }
.md-note { font-size: .82em; line-height: 1.7; color: var(--muted); margin: 0 0 1.4em; }
.md-note p { margin: 0 0 .4em; }
.md-insight { margin: 1.6em 0; padding: 16px 18px; background: var(--accent-soft); border-radius: 8px; font-weight: 700; color: var(--text); }
.md-insight p:last-child { margin-bottom: 0; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 0 0 1.4em; }
.metric { background: var(--bg); padding: 14px 16px; }
.metric b { display: block; font-size: 1.25em; line-height: 1.3; font-variant-numeric: tabular-nums; }
.metric span { font-size: .8em; color: var(--muted); }
.md-check { list-style: none; padding-left: 0 !important; }
.md-check li { margin: 0; border-bottom: 1px solid var(--line); }
.md-check label { display: flex; gap: 12px; padding: 11px 0; cursor: pointer; align-items: flex-start; }
.md-check input { width: 18px; height: 18px; margin: .35em 0 0; flex: none; accent-color: var(--accent); }
.md-check input:checked + span { color: var(--muted); text-decoration: line-through; }

.art-end { padding: 18px 0 8px; border-top: 1px solid var(--line); margin-top: 24px; }
.status-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.status-row .lbl { font-size: 13px; color: var(--muted); margin-right: 4px; }
.done-btn { display: block; width: 100%; height: 48px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 700; font-size: 15px; margin: 18px 0 6px; transition: transform 160ms var(--ease), opacity 150ms ease; }
.done-btn:active { transform: scale(0.98); }
.done-btn.is-done { background: var(--bg-soft); color: var(--muted); }
.sec-title { font-size: 15px; font-weight: 800; margin: 28px 0 10px; }
.memo { width: 100%; min-height: 110px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px 14px; font-size: 15px; line-height: 1.7; background: var(--bg); resize: vertical; outline: none; }
.memo:focus { border-color: var(--accent); }
.memo-state { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 18px; }
.quotes { list-style: none; padding: 0; margin: 0; }
.quotes li { position: relative; padding: 12px 36px 12px 16px; border-left: 3px solid var(--accent); background: var(--bg-soft); border-radius: 0 6px 6px 0; margin-bottom: 8px; font-size: 15px; line-height: 1.75; }
.quotes li button { position: absolute; top: 8px; right: 6px; width: 28px; height: 28px; color: var(--muted); border-radius: 6px; }
.quotes .hint { background: none; border: 0; padding: 0; font-size: 13.5px; color: var(--muted); }
.links { font-size: 14px; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.credit-line { font-size: 12.5px; color: var(--muted); margin: 18px 0 0; }
.art-actions { display: flex; gap: 14px; flex-wrap: wrap; padding: 28px 0 64px; font-size: 13.5px; }
.art-actions button, .art-actions a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.art-actions .del { color: var(--danger); }

/* 문장 저장 버튼 */
.qpill {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 40;
  transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); height: 44px; padding: 0 18px; border-radius: 999px; font-size: 14.5px; font-weight: 700;
  box-shadow: 0 6px 24px rgba(0,0,0,.18);
  transition: transform 220ms var(--ease), opacity 180ms ease;
}
.qpill.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast {
  position: fixed; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 45; transform: translate(-50%, 8px); opacity: 0;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; pointer-events: none;
  transition: transform 220ms var(--ease), opacity 180ms ease; max-width: calc(100% - 40px); text-align: center;
}
.toast.on { transform: translate(-50%, 0); opacity: 1; }

/* 이미지 크게 보기 */
.lb { position: fixed; inset: 0; z-index: 60; background: rgba(10,11,13,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 200ms ease; overflow: auto; }
.lb.on { opacity: 1; }
.lb img { max-width: 100vw; max-height: calc(100vh - 110px); object-fit: contain; transform: scale(.97); transition: transform 240ms var(--ease); cursor: zoom-out; }
.lb.on img { transform: scale(1); }
.lb.full { justify-content: flex-start; align-items: flex-start; }
.lb.full img { max-width: none; max-height: none; }
.lb .cap { color: #d6d9de; font-size: 13.5px; line-height: 1.6; padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); max-width: 720px; text-align: center; }
.lb .x { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px; width: 44px; height: 44px; color: #fff; font-size: 26px; border-radius: 999px; background: rgba(255,255,255,.08); }

/* 시트(작은 창) */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.32); opacity: 0; transition: opacity 200ms ease; }
.sheet-bg.on { opacity: 1; }
.sheet {
  position: fixed; z-index: 51; left: 50%; bottom: 0; width: 100%; max-width: 520px; transform: translate(-50%, 100%);
  background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px 20px calc(20px + env(safe-area-inset-bottom));
  transition: transform 280ms var(--ease); border: 1px solid var(--line);
}
.sheet.on { transform: translate(-50%, 0); }
.sheet h3 { font-size: 15px; margin: 14px 0 10px; }
.sheet .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; gap: 12px; }
.sheet .row:last-child { border-bottom: 0; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 36px; border: 1px solid var(--line-strong); border-radius: 8px; font-weight: 700; }
.stepper span { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.sheet-act { display: block; width: 100%; text-align: left; padding: 13px 0; font-size: 15px; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; }
.sheet-act.del { color: var(--danger); }

/* 폼 화면 (토큰, 추가, 설정) */
.page { padding-top: 28px; padding-bottom: 64px; }
.page h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -0.02em; }
.page h2 { font-size: 17px; margin: 32px 0 8px; }
.page p { margin: 0 0 12px; color: var(--text-2); font-size: 15px; text-wrap: pretty; }
.field { width: 100%; height: 46px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 14px; background: var(--bg); outline: none; font-size: 15px; }
.field.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
textarea.field { height: 240px; padding: 12px 14px; line-height: 1.55; resize: vertical; }
.field:focus { border-color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 20px; border-radius: 10px; font-weight: 700; font-size: 15px; border: 1px solid var(--line-strong); transition: transform 160ms var(--ease), opacity 150ms ease; text-decoration: none; color: var(--text); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.msg { font-size: 14px; margin-top: 10px; line-height: 1.6; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--ok); }
.errs { margin: 10px 0 0; padding-left: 1.2em; color: var(--danger); font-size: 14px; }
.preview { border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 14px; }
.preview .k { font-size: 13px; color: var(--muted); }
.preview h3 { margin: 6px 0; font-size: 18px; line-height: 1.45; }
.preview dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin: 10px 0 0; }
.preview dt { color: var(--muted); }
.preview dd { margin: 0; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 15px; cursor: pointer; }
.radio input { margin-top: .3em; accent-color: var(--accent); }
.kv { font-size: 14px; color: var(--text-2); }
.kv code { font-size: 13px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}
@media print {
  .topbar, .tabs, .art-end, .art-actions, .qpill { display: none !important; }
}
</style>
<script>
/* 첫 화면이 번쩍이지 않게 테마를 먼저 정한다 */
(function () {
  try {
    var p = JSON.parse(localStorage.getItem("scrapbook.prefs") || "{}");
    var t = p.theme === "dark" || (p.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    if (p.fs) document.documentElement.style.setProperty("--fs", p.fs + "px");
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="app"></div>
<button class="qpill" id="qpill" type="button">✎ 이 문장 저장</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================
   스크랩북
   - 코드는 공개 저장소(syrano15/scrapbook), 기사와 개인 기록은
     비공개 저장소(syrano15/scrapbook-data)에 둔다.

/* ---------- GitHub 비공개 저장소 ---------- */
function b64encode(str) {
  var bytes = new TextEncoder().encode(str), bin = "", CH = 0x8000;
  for (var i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
function b64decode(b64) {
  var bin = atob(String(b64).replace(/\s/g, "")), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function encPath(p) { return p.split("/").map(encodeURIComponent).join("/"); }
function ghFetch(url, opt) {
  opt = opt || {};
  var headers = Object.assign({ "Authorization": "Bearer " + token(), "X-GitHub-Api-Version": "2022-11-28" }, opt.headers || {});
  return fetch(url, Object.assign({}, opt, { headers: headers, cache: "no-store" })).then(function (r) {
    if (r.status === 401) { var e = new Error("토큰이 맞지 않거나 만료됐어요."); e.code = 401; throw e; }
    return r;
  });
}
/* 파일 읽기: { text, sha } 또는 없으면 null */
function readFile(path) {
  return ghFetch(API + "/contents/" + encPath(path), { headers: { "Accept": "application/vnd.github+json" } }).then(function (r) {
    if (r.status === 404) return null;
    if (!r.ok) throw new Error("읽기 실패 (" + r.status + ")");
    return r.json().then(function (j) {
      if (j.content && j.encoding === "base64") return { text: b64decode(j.content), sha: j.sha };
      /* 1MB가 넘는 파일은 content가 비어 온다: raw로 다시 읽는다 */
      return ghFetch(API + "/contents/" + encPath(path), { headers: { "Accept": "application/vnd.github.raw+json" } })
        .then(function (r2) { return r2.text(); }).then(function (t) { return { text: t, sha: j.sha }; });
    });
  });
}
function readJson(path) { return readFile(path).then(function (f) { return f ? { data: JSON.parse(f.text), sha: f.sha } : null; }); }
function writeFile(path, text, sha, message) {
  var body = { message: message || ("update " + path), content: b64encode(text) };
  if (sha) body.sha = sha;
  return ghFetch(API + "/contents/" + encPath(path), { method: "PUT", headers: { "Accept": "application/vnd.github+json", "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) {
      if (r.status === 409 || r.status === 422) { var e = new Error("conflict"); e.code = 409; throw e; }
      if (!r.ok) throw new Error("저장 실패 (" + r.status + ")");
      return r.json().then(function (j) { return j.content && j.content.sha; });
    });
}
function deleteFile(path, message) {
  return readFile(path).then(function (f) {
    if (!f) return;
    return ghFetch(API + "/contents/" + encPath(path), { method: "DELETE", headers: { "Accept": "application/vnd.github+json", "Content-Type": "application/json" }, body: JSON.stringify({ message: message || ("delete " + path), sha: f.sha }) })
      .then(function (r) { if (!r.ok && r.status !== 404) throw new Error("삭제 실패 (" + r.status + ")"); });
  });
}
var blobCache = {};
function imageUrl(src) {
  if (isUrl(src)) return Promise.resolve(src);
  if (!isRepoPath(src)) return Promise.reject(new Error("bad src"));
  if (blobCache[src]) return blobCache[src];
  blobCache[src] = ghFetch(API + "/contents/" + encPath(src), { headers: { "Accept": "application/vnd.github.raw+json" } })
    .then(function (r) { if (!r.ok) throw new Error("img " + r.status); return r.blob(); })
    .then(function (b) { return URL.createObjectURL(b); });
  blobCache[src].catch(function () { delete blobCache[src]; });
  return blobCache[src];
}

/* ---------- 데이터 ---------- */
var DB = {
  index: lsGet(K.index, null),   /* { articles: [...] } */
  indexSha: null,
  user: lsGet(K.user, null),     /* { items: { id: {...} } } */
  userSha: null,
  loaded: false
};
function articles() { return (DB.index && DB.index.articles) || []; }
function findMeta(id) { return articles().filter(function (a) { return a.id === id; })[0] || null; }
function uitem(id) {
  if (!DB.user) DB.user = { schemaVersion: 1, items: {} };
  if (!DB.user.items) DB.user.items = {};
  return DB.user.items[id] || { status: "unread" };
}
function setU(id, patch) {
  var cur = Object.assign({}, uitem(id), patch, { updatedAt: nowIso() });
  DB.user.items[id] = cur;
  lsSet(K.user, DB.user);
  queueSave();
  return cur;
}

function loadAll() {
  return Promise.all([readJson("index.json"), readJson("user.json")]).then(function (res) {
    var idx = res[0], usr = res[1];
    DB.index = idx ? idx.data : { schemaVersion: 1, articles: [] };
    DB.indexSha = idx ? idx.sha : null;
    var remoteUser = usr ? usr.data : { schemaVersion: 1, items: {} };
    DB.userSha = usr ? usr.sha : null;
    /* 저장 못 하고 남은 이 기기 기록이 있으면 합친다 */
    var local = lsGet(K.user, null);
    DB.user = mergeUser(remoteUser, local);
    lsSet(K.index, DB.index); lsSet(K.user, DB.user);
    DB.loaded = true;
    if (JSON.stringify(DB.user) !== JSON.stringify(remoteUser)) queueSave();
  });
}
function mergeUser(a, b) {
  var out = { schemaVersion: 1, items: {} };
  [a, b].forEach(function (src) {
    if (!src || !src.items) return;
    Object.keys(src.items).forEach(function (id) {
      var x = src.items[id], y = out.items[id];
      if (!y) { out.items[id] = x; return; }
      var newer = (x.updatedAt || "") > (y.updatedAt || "") ? x : y, older = newer === x ? y : x;
      var merged = Object.assign({}, newer);
      /* 저장한 문장은 양쪽 것을 다 남긴다 */
      var seen = {}, qs = [];
      (newer.quotes || []).concat(older.quotes || []).forEach(function (q) { if (q && q.text && !seen[q.text]) { seen[q.text] = 1; qs.push(q); } });
      if (newer.quotesDeleted) qs = qs.filter(function (q) { return newer.quotesDeleted.indexOf(q.text) < 0; });
      if (qs.length) merged.quotes = qs;
      out.items[id] = merged;
    });
  });
  return out;
}

/* 개인 기록 저장: 모아서 한 번에, 충돌 나면 다시 읽어서 합친다 */
var saving = false, dirty = false, syncState = "ok", saveTimer = null;
function setSync(s) { syncState = s; var el = document.getElementById("sync"); if (el) paintSync(el); }
function paintSync(el) {
  el.className = "sync" + (syncState === "err" ? " err" : "");
  el.textContent = syncState === "saving" ? "저장 중…" : syncState === "err" ? "저장 실패 · 다시" : syncState === "pending" ? "저장 대기" : "";
  el.title = syncState === "err" ? "눌러서 다시 저장" : "";
}
var saveDue = 0;
function queueSave(delay) {
  dirty = true; setSync("pending");
  var due = Date.now() + (delay == null ? 2500 : delay);
  /* 이미 더 빨리 저장하기로 한 게 있으면 그 시간을 지킨다 */
  if (saveTimer && saveDue && saveDue <= due) return;
  clearTimeout(saveTimer); saveDue = due;
  saveTimer = setTimeout(function () { saveTimer = null; saveDue = 0; flushUser(); }, due - Date.now());
}
function flushUser() {
  if (!token() || !DB.loaded) return Promise.resolve();
  if (saving) { dirty = true; return Promise.resolve(); }
  if (!dirty) return Promise.resolve();
  saving = true; dirty = false; setSync("saving");
  DB.user.updatedAt = nowIso();
  var text = JSON.stringify(DB.user, null, 1);
  return writeFile("user.json", text, DB.userSha, "개인 기록 저장").then(function (sha) {
    DB.userSha = sha; saving = false; setSync(dirty ? "pending" : "ok");
    if (dirty) queueSave(1500);
  }).catch(function (e) {
    if (e.code === 409) {
      return readJson("user.json").then(function (r) {
        DB.user = mergeUser(r ? r.data : null, DB.user); DB.userSha = r ? r.sha : null; lsSet(K.user, DB.user);
        saving = false; dirty = true; return flushUser();
      }).catch(function () { saving = false; dirty = true; setSync("err"); });
    }
    saving = false; dirty = true; setSync("err");
  });
}
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") { savePos(); if (dirty) flushUser(); } });

function getArticle(id) {

}
function cacheArticle(id, data) {

  /* 저장 공간이 차면 오래된 기사 캐시부터 지운다 */

  } catch (e) {}
}

    if (v.warns.length) { var wl = h("ul", "errs"); wl.style.color = "var(--muted)"; v.warns.forEach(function (x) { wl.appendChild(h("li", null, x)); }); out.appendChild(wl); }

    var choice = mode;
    if (dup && !editId) {
      var box = h("div"); box.style.marginTop = "16px";
      box.appendChild(h("div", "msg err", "이미 담아 둔 글과 원문이 같아요: ‘" + dup.title + "’"));
      [["update", "기존 글 업데이트 (읽기 상태·메모는 그대로)"], ["new", "새 글로 따로 추가"]].forEach(function (o, k) {
        var lab = h("label", "radio"), r = h("input"); r.type = "radio"; r.name = "mode"; r.value = o[0]; if (!k) r.checked = true;
        r.addEventListener("change", function () { choice = r.value; });
        lab.appendChild(r); lab.appendChild(h("span", null, o[1])); box.appendChild(lab);
      });
      out.appendChild(box);
    }
    var sb = h("div", "btns"), go = h("button", "btn primary", mode === "update" ? "저장" : "스크랩북에 추가"); go.type = "button";
    sb.appendChild(go); out.appendChild(sb);
    var msg = h("div", "msg"); out.appendChild(msg);
    go.addEventListener("click", function () {
      go.disabled = true; msg.className = "msg"; msg.textContent = "저장하는 중…";
      var now = nowIso(), id, prev = null;
      if (choice === "update" && dup) { id = dup.id; prev = dup; }
      else {
        id = a.id && !findMeta(a.id) ? a.id : slugify(a);
        while (findMeta(id)) id = id.replace(/-\d+$/, "") + "-" + Math.floor(Math.random() * 90 + 10);
      }
      a.id = id; a.addedAt = prev ? (prev.addedAt || now) : now; a.updatedAt = now;
      readFile("articles/" + id + ".json").then(function (f) {
        return writeFile("articles/" + id + ".json", JSON.stringify(a, null, 1), f ? f.sha : null, (prev ? "기사 수정: " : "기사 추가: ") + a.title);
      }).then(function () {
        return updateIndex(function (lst) { var m = metaOf(a); var o = lst.filter(function (x) { return x.id !== id; }); o.push(m); return o; }, "목록 갱신: " + a.title);
      }).then(function () {
        cacheArticle(id, a);
        msg.className = "msg ok"; msg.textContent = "저장했어요.";
        location.hash = "#/a/" + encodeURIComponent(id);
      }).catch(function (e) { go.disabled = false; msg.className = "msg err"; msg.textContent = "저장하지 못했어요: " + e.message; });
    });
  });
}

/* ---------- 설정 · 백업 ---------- */
function renderSettings() {
  $app.innerHTML = ""; window.scrollTo(0, 0);
  $app.appendChild(topbar({ back: true }));
  var w = h("main", "wrap page"); $app.appendChild(w);
  w.innerHTML = '<h1>설정</h1>';

  w.appendChild(h("h2", null, "화면"));
  var seg = h("div", "seg"); seg.style.height = "36px";
  [["auto", "기기 설정"], ["light", "밝게"], ["dark", "어둡게"]].forEach(function (o) {
    var b = h("button", null, o[1]); b.type = "button"; b.setAttribute("aria-pressed", (prefs.theme || "auto") === o[0]);
    b.addEventListener("click", function () { prefs.theme = o[0]; savePrefs(); applyTheme(); Array.prototype.forEach.call(seg.children, function (x) { x.setAttribute("aria-pressed", x === b); }); });
    seg.appendChild(b);
  });
  w.appendChild(seg);

  w.appendChild(h("h2", null, "전체 백업"));
  w.appendChild(h("p", null, "기사, 읽기 상태, 메모를 파일 하나로 받아요. 비공개 저장소에도 기록이 남지만, 가끔 받아 두면 마음이 편해요."));
  var b1 = h("button", "btn", "백업 파일 받기"); b1.type = "button";
  var m1 = h("div", "msg"); w.appendChild(b1); w.appendChild(m1);
  b1.addEventListener("click", function () {
    b1.disabled = true; m1.className = "msg"; m1.textContent = "모으는 중…";
    var list = articles(), arts = [];
    (function next(i) {
      if (i >= list.length) {
        var data = { kind: "scrapbook-backup", schemaVersion: 1, exportedAt: nowIso(), index: DB.index, articles: arts, user: DB.user };
        var blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
        var a = h("a"); a.href = URL.createObjectURL(blob); a.download = "scrapbook-backup-" + new Date().toISOString().slice(0, 10) + ".json";
        document.body.appendChild(a); a.click(); a.remove();
        b1.disabled = false; m1.className = "msg ok"; m1.textContent = "기사 " + arts.length + "편을 받았어요. 이미지는 저장소에만 있어요.";
        return;
      }
      readJson("articles/" + list[i].id + ".json").then(function (r) { if (r) arts.push(r.data); }).catch(function () {}).then(function () { m1.textContent = "모으는 중… " + (i + 1) + "/" + list.length; next(i + 1); });
    })(0);
  });

  w.appendChild(h("h2", null, "백업에서 되살리기"));
  w.appendChild(h("p", null, "지금 있는 글은 지우지 않아요. 백업에만 있는 글을 다시 넣고, 읽기 상태와 메모는 더 최근 것을 남겨요."));
  var ow = h("label", "radio"), owc = h("input"); owc.type = "checkbox"; owc.style.accentColor = "var(--accent)";
  ow.appendChild(owc); ow.appendChild(h("span", null, "같은 글이 있으면 백업 내용으로 덮어쓰기"));
  var lab = h("label", "btn", "백업 파일 고르기"), fi = h("input"); fi.type = "file"; fi.accept = ".json,application/json"; fi.hidden = true; lab.appendChild(fi);
  var m2 = h("div", "msg");
  w.appendChild(ow); w.appendChild(lab); w.appendChild(m2);
  fi.addEventListener("change", function () {
    var f = fi.files && fi.files[0]; if (!f) return;
    f.text().then(function (t) {
      var d = JSON.parse(t);
      if (!d || d.kind !== "scrapbook-backup" || !Array.isArray(d.articles)) throw new Error("스크랩북 백업 파일이 아니에요.");
      var have = {}; articles().forEach(function (a) { have[a.id] = 1; });
      var todo = d.articles.filter(function (a) { return a && a.id && (owc.checked || !have[a.id]) && !validate(a).errs.length; });
      if (!confirm("백업에서 글 " + todo.length + "편을 넣고, 읽기 기록을 합칠까요?")) return;
      m2.className = "msg"; m2.textContent = "되살리는 중…";
      var i = 0;
      function next() {
        if (i >= todo.length) return Promise.resolve();
        var a = todo[i++];
        m2.textContent = "되살리는 중… " + i + "/" + todo.length;
        return readFile("articles/" + a.id + ".json").then(function (f2) { return writeFile("articles/" + a.id + ".json", JSON.stringify(a, null, 1), f2 ? f2.sha : null, "백업에서 복원: " + a.title); }).then(next);
      }
      return next().then(function () {
        if (!todo.length) return;
        return updateIndex(function (lst) { var ids = {}; todo.forEach(function (a) { ids[a.id] = 1; }); return lst.filter(function (x) { return !ids[x.id]; }).concat(todo.map(metaOf)); }, "백업에서 목록 복원");
      }).then(function () {
        DB.user = mergeUser(DB.user, d.user); lsSet(K.user, DB.user); queueSave(300);
        m2.className = "msg ok"; m2.textContent = "되살렸어요 (글 " + todo.length + "편).";
      });
    }).catch(function (e) { m2.className = "msg err"; m2.textContent = e.message; });
    fi.value = "";
  });

  w.appendChild(h("h2", null, "이 기기 연결"));
  w.appendChild(h("p", null, "토큰을 지우면 이 기기에서는 다시 넣기 전까지 글이 안 보여요. 모닝 브리핑의 읽을거리 카드도 같이 숨겨져요."));
  var b3 = h("button", "btn", "이 기기에서 토큰 지우기"); b3.type = "button";
  b3.addEventListener("click", function () {
    if (!confirm("이 기기에서 연결을 끊을까요? (저장소의 글은 그대로예요)")) return;
    lsDel(K.token); lsDel(K.index); lsDel(K.user);
    Object.keys(localStorage).forEach(function (k) { if (k.indexOf(K.art) === 0) lsDel(k); });
    location.hash = "#/"; route();
  });
  w.appendChild(b3);
  var info = h("p", "kv"); info.style.marginTop = "36px";
  info.innerHTML = '기사 저장소: <code>syrano15/scrapbook-data</code> (비공개) · <a href="ARTICLE_IMPORT_SPEC.md" target="_blank">등록 규격</a>';
  w.appendChild(info);
}

/* ---------- 시작 ---------- */
function boot() {
  route();
  if (!token()) return;
  loadAll().then(function () {
    if (view && view.refresh) view.refresh();
    else if (/^#\/?$/.test(location.hash) || !location.hash) route();
    prefetchBodies();
  }).catch(function (e) {
    if (e.code === 401) { toast("토큰이 맞지 않거나 만료됐어요. 다시 넣어 주세요."); lsDel(K.token); route(); return; }
    toast(articles().length ? "오프라인이에요 · 저장해 둔 글로 보여 드려요" : "불러오지 못했어요: " + e.message);
  });
}
window.addEventListener("pageshow", function (e) { if (e.persisted && token()) loadAll().then(function () { if (view && view.refresh) view.refresh(); }).catch(function () {}); });
try { sessionStorage.removeItem("sb.fromList"); } catch (e) {}
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
boot();
